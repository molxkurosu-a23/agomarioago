<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>STAGE 1：コイン収集 | しゃくれライオン</title><link rel="stylesheet" href="game.css"></head><body data-stage="1"><main><header><h1>🦁 しゃくれライオン・アドベンチャー</h1><div class="stats"><span class="pill">🪙 <b id="coins">0</b></span><span class="pill">❤️ <b id="lives">3</b></span><span class="pill">🦷 アゴ <b id="chin">0</b></span><span class="pill">⏱️ 残り <b id="timer">90.0</b>s</span><span class="pill" id="bossStat" style="display:none">🐘 象の老武術家 <b id="bossHp">5</b>/5</span></div></header><div class="stage"><canvas id="game" width="960" height="540"></canvas><div class="overlay" id="overlay"><div class="panel" id="panel"></div></div></div><div class="controls"><div class="dpad"><button class="up" data-key="jump">▲</button><button class="left" data-key="left">◀</button><button class="center">●</button><button class="right" data-key="right">▶</button><button class="down" data-key="down">▼</button></div><button class="jump" data-key="jump">⤒<br>ジャンプ</button></div><div class="hint">スマホ：下の十字キーで移動、ジャンプボタンでジャンプ。PC：← → / A・D、Space。<br>赤いキノコは当たり、青いキノコはハズレ。敵はアゴ攻撃か踏みつけで倒そう。</div></main><script src="game.js"></script></body></html>
