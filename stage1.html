<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>STAGE 1：コイン収集 | しゃくれライオン</title><link rel="stylesheet" href="game.css"></head><body data-stage="1"><main><header><h1>🦁 しゃくれライオン・アドベンチャー</h1><div class="stats"><span class="pill">🪙 <b id="coins">0</b></span><span class="pill">❤️ <b id="lives">3</b></span><span class="pill">🦷 アゴ <b id="chin">0</b></span><span class="pill">⏱️ 残り <b id="timer">90.0</b>s</span><span class="pill" id="bossStat" style="display:none">🐘 象の老武術家 <b id="bossHp">5</b>/5</span></div><div class="utility-actions"><button id="fullscreenButton" type="button" onclick="goFullscreen()">⛶ 全画面</button></div></header><div class="rotateNotice">📱 スマートフォンを横向きにしてください</div><div class="play-layout"><section class="control-side left-side" aria-label="移動操作"><div class="dpad"><button class="up" data-key="jump" aria-label="ジャンプ">▲</button><button class="left" data-key="left" aria-label="左">◀</button><button class="center" type="button">●</button><button class="right" data-key="right" aria-label="右">▶</button><button class="down" data-key="down" aria-label="下">▼</button></div><small>移動</small></section><div class="stage"><canvas id="game" width="960" height="540"></canvas><div class="overlay" id="overlay"><div class="panel" id="panel"></div></div></div><section class="control-side right-side" aria-label="アクション操作"><button class="jump" data-key="jump">⤒<span>ジャンプ</span></button></section></div><div class="hint">PC：← → / A・D、Spaceでジャンプ、Xで必殺技。スマホ：左の十字キーで移動、右のボタンでジャンプ・必殺技。</div></main><script>function goFullscreen(){const e=document.documentElement;if(!document.fullscreenElement&&e.requestFullscreen){e.requestFullscreen().then(()=>{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock("landscape").catch(()=>{});}).catch(()=>{});}else if(document.exitFullscreen)document.exitFullscreen();}</script><script src="game.js"></script><script>(function(){const side=document.querySelector('.right-side');const obs=new MutationObserver(()=>{const b=document.getElementById('specialMoveButton');if(b&&side&&b.parentElement!==side){side.appendChild(b);b.classList.add('special-action');b.style.cssText='display:none;';}});obs.observe(document.body,{childList:true,subtree:true});const b=document.getElementById('specialMoveButton');if(b&&side&&b.parentElement!==side){side.appendChild(b);b.classList.add('special-action');b.style.cssText='display:none;';}})();</script></body></html>
